environment: production

server:
  host: 0.0.0.0
  port: 4002
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s

database:
  host: ${DB_HOST}
  port: 5432
  user: ${DB_USER}
  password: ${DB_PASSWORD}
  db_name: user_db
  schema: "user"
  sslmode: require
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: 5m

jwt:
  secret: ${JWT_SECRET}
  access_token_duration: 15m
  issuer: "farmanexo-auth-service"

aws:
  region: ${AWS_REGION}
  endpoint: ""

sqs:
  user_events_queue_url: ${SQS_USER_EVENTS_QUEUE_URL}
  auth_events_queue_url: ${SQS_AUTH_EVENTS_QUEUE_URL}

s3:
  avatars_bucket: "farmanexo-avatars"

log:
  level: error
  encoding: json
